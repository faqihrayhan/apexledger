[project]
name = "apexledger"
version = "0.1.0"
description = "Open-Core On-Premise AI-Native Accounting Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSL-1.1" }
authors = [
    { name = "ApexLedger", email = "hello@apexledger.com" },
]

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.14,<2.0",
    "pydantic[email]>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "passlib[argon2]>=1.7,<2.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "httpx>=0.27,<1.0",
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
# Alembic migrations are auto-generated DDL dumps — don't lint them.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
# NOTE: TCH/TC rules are intentionally disabled — SQLAlchemy resolves ORM
# annotations at runtime, so imports cannot be moved into TYPE_CHECKING blocks.
ignore = ["B008"]  # FastAPI uses Depends() in function defaults by design

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
